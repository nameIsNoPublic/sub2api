# =============================================================================
# 52code 生产部署（与同机其他项目完全独立）
# =============================================================================
# 容器：52code-nginx -> 52code-app（sub2api）-> 52code-postgres / 52code-redis
# 链路：边缘机（TLS）-> 本机 ${BIND_HOST}:${PUBLIC_PORT} -> nginx -> app:8080
#
# 应用、数据库、缓存三个服务用 extends 复用 ../docker-compose.yml 的定义：
# 上游 sub2api 更新 compose 时这里自动跟随，本文件只覆盖 52code 需要改的字段。
# 变量名与 ../.env.example 一致，放在本目录的 .env 里。
#
# 用法（在本目录执行）：
#   cp .env.example .env && 编辑 .env
#   docker compose build        # 用本仓库代码构建镜像（不拉上游镜像）
#   docker compose up -d
# =============================================================================

name: 52code

services:
  # ---------------------------------------------------------------------------
  # 反向代理：唯一对外暴露的入口
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: 52code-nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PUBLIC_PORT:-18080}:80"
    volumes:
      # 模板由镜像启动脚本用 envsubst 渲染到 /etc/nginx/conf.d/default.conf
      - ./nginx/templates:/etc/nginx/templates:ro
    environment:
      - EDGE_IP=${EDGE_IP:-127.0.0.1}
      - SERVER_NAMES=${SERVER_NAMES:-52code.ai www.52code.ai}
      - TZ=${TZ:-Asia/Shanghai}
    depends_on:
      sub2api:
        condition: service_healthy
    networks:
      - sub2api-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # 应用：沿用上游定义，改为自建镜像，不再直接发布端口
  # ---------------------------------------------------------------------------
  sub2api:
    extends:
      file: ../docker-compose.yml
      service: sub2api
    container_name: 52code-app
    image: 52code/app:${C52_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.org}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-}
        VERSION: ${C52_VERSION:-}
        COMMIT: ${C52_COMMIT:-docker}
    # 应用端口只在内部网络可见，统一从 nginx 进入
    ports: !reset []

  # ---------------------------------------------------------------------------
  # 数据库与缓存：独立实例，不与同机其他项目共用
  # ---------------------------------------------------------------------------
  postgres:
    extends:
      file: ../docker-compose.yml
      service: postgres
    container_name: 52code-postgres

  redis:
    extends:
      file: ../docker-compose.yml
      service: redis
    container_name: 52code-redis

# extends 不会带入顶层的卷和网络，这里按上游同名重新声明；
# 实际名称会带 52code_ 前缀（52code_postgres_data 等），与其他项目不冲突。
volumes:
  sub2api_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  sub2api-network:
    driver: bridge
